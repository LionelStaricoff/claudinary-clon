version: '3.8'

services:
  claudinary-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claudinary-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://claudinary-db:5432/claudinary
      - SPRING_DATASOURCE_USERNAME=claudinary
      - SPRING_DATASOURCE_PASSWORD=claudinary123
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong123456789
      - IMAGEHOST_STORAGE_DIRECTORY=/app/uploads
      - IMAGEHOST_STORAGE_WEBP_DIRECTORY=/app/uploads/webp
      - IMAGEHOST_STORAGE_THUMBNAIL_DIRECTORY=/app/uploads/thumbnails
      - IMAGEHOST_MAX_FILE_SIZE=10485760
      - IMAGEHOST_MAX_STORAGE_PER_USER=104857600
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      claudinary-db:
        condition: service_healthy
    networks:
      - claudinary-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  claudinary-db:
    image: postgres:15-alpine
    container_name: claudinary-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=claudinary
      - POSTGRES_USER=claudinary
      - POSTGRES_PASSWORD=claudinary123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - claudinary-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudinary"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional Nginx reverse proxy for production
  claudinary-nginx:
    image: nginx:alpine
    container_name: claudinary-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - claudinary-app
    networks:
      - claudinary-network

  # Optional Redis for session caching (if needed)
  claudinary-redis:
    image: redis:alpine
    container_name: claudinary-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - claudinary-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  claudinary-network:
    driver: bridge
