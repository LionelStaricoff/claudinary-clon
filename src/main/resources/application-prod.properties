# Production Configuration for Claudinary
# This file should be used in production environments

# Server Configuration
server.port=8080
server.servlet.context-path=
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Spring Application
spring.application.name=Claudinary

# Database Configuration - PostgreSQL (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/claudinary
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=claudinary
spring.datasource.password=claudinary123

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClaudinaryPool

# JPA / Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=/tmp/claudinary-uploads

# JWT Configuration (CHANGE THIS IN PRODUCTION!)
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong123456789}
jwt.access.expiration=3600
jwt.refresh.expiration=86400

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Static Resources Configuration
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/,file:./uploads/
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.must-revalidate=false

# Storage Configuration
imagehost.storage.directory=/app/uploads
imagehost.storage.webp-directory=/app/uploads/webp
imagehost.storage.thumbnail-directory=/app/uploads/thumbnails
imagehost.max-file-size=10485760
imagehost.max-storage-per-user=104857600
imagehost.base-url=http://localhost:8080

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# CORS Configuration (Configure for your frontend domains)
claudinary.cors.allowed-origins=http://localhost:3000,http://localhost:8080,https://yourdomain.com
claudinary.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
claudinary.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
claudinary.cors.allow-credentials=true

# Logging Configuration
logging.level.root=WARN
logging.level.com.openlabmx.claudinary=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.file.name=/app/logs/claudinary.log
logging.file.max-size=10MB
logging.file.max-history=7

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.enabled=true

# Application Properties
app.name=Claudinary
app.version=1.0.0
app.description=Self-hosted image hosting service with WebP conversion
app.environment=production

# Spring Profiles
spring.profiles.active=prod

# Actuator Configuration (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Health Indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=104857600

# Session Configuration
spring.session.store-type=none

# SSL Configuration (if using HTTPS)
# server.ssl.key-store=/path/to/keystore.p12
# server.ssl.key-store-password=yourpassword
# server.ssl.key-store-type=PKCS12
