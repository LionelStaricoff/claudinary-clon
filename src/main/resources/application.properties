# Server Configuration
server.port=8081
server.servlet.context-path=
server.forward-headers-strategy=framework

# Spring Application
spring.application.name=ImageHost

# Database Configuration - H2 (Development)
spring.datasource.url=jdbc:h2:file:./data/imagehost-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=ChangeThisProductionSecretKeyForJwtTokenGenerationHS512MustBeAtLeast64BytesLong1234567890ABCDEF
jwt.access.expiration=3600
jwt.refresh.expiration=86400

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Static Resources Configuration
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# Storage Configuration
imagehost.storage.directory=./uploads
imagehost.storage.webp-directory=./uploads/webp
imagehost.storage.thumbnail-directory=./uploads/thumbnails
imagehost.max-file-size=10485760
imagehost.max-storage-per-user=104857600

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Logging Configuration
logging.level.root=INFO
logging.level.com.openlabmx.imagehost=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Application Properties
app.name=ImageHost
app.version=1.0.0
app.description=Self-hosted image hosting service with WebP conversion

# Development Profile
spring.profiles.active=dev
