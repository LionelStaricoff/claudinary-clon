<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">My Gallery - ImageHost</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    
    <style>
        .image-card {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .image-card img {
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .card-body {
            padding: 10px;
        }
        .project-filter {
            max-width: 200px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Flash Messages -->
    <div th:if="${success}" class="container mt-3">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Success!</strong> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <div th:if="${error}" class="container mt-3">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error!</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="container mt-4">
        <h2 class="mb-4">My Gallery</h2>
        
        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-3 mb-3 mb-md-0">
                        <label class="form-label">Filter by Project</label>
                        <select class="form-select project-filter" id="projectFilter" 
                                onchange="window.location.href = '/gallery?projectId=' + this.value">
                            <option value="">All Projects</option>
                            <option th:each="project : ${projects}" 
                                    th:value="${project.id}" 
                                    th:text="${project.name}"
                                    th:selected="${project.id == selectedProjectId}"></option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label">Search Images</label>
                        <div class="input-group">
                            <input type="text" class="form-control" 
                                   placeholder="Search by filename..." 
                                   th:value="${searchQuery}" id="searchInput">
                            <button class="btn btn-primary" type="button" onclick="searchImages()">
                                <i class="bi bi-search"></i>
                            </button>
                            <button class="btn btn-outline-secondary" type="button" 
                                    onclick="clearSearch()" th:if="${searchQuery != null}">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="col-md-3 text-md-end">
                        <a href="/upload" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Upload Image
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h5 th:if="${images != null && !images.empty}">
                    <span th:text="${totalElements}"></span> images found
                </h5>
                <nav th:if="${images != null && !images.empty}" aria-label="Page navigation">
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/gallery(page=${currentPage - 1}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}">
                                Previous
                            </a>
                        </li>
                        <li class="page-item" th:each="page : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${page == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/gallery(page=${page}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}"
                               th:text="${page + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/gallery(page=${currentPage + 1}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
        
        <div class="gallery-grid" th:if="${images != null && !images.empty}">
            <div class="image-card card" th:each="image : ${images}">
                <a th:href="@{/image/{id}(id=${image.id})}" class="text-decoration-none text-dark">
                    <img th:src="${image.thumbnailUrl != null ? image.thumbnailUrl : image.url}" 
                         alt="Preview" class="img-fluid">
                </a>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-0" th:text="${image.originalFilename}"></h6>
                            <small class="text-muted">
                                <span th:text="${image.originalFormat}"></span> - 
                                <span th:text="${image.width} + 'x' + ${image.height}"></span>
                            </small>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary" type="button" 
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" th:href="@{/image/{id}(id=${image.id})}">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="${image.url}" download th:text="${image.originalFilename}">
                                        <i class="bi bi-download"></i> Download
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item text-danger" href="#" 
                                       onclick="confirmDelete('${image.id}')">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="no-results text-center py-5" th:if="${images == null || images.empty}">
            <i class="bi bi-images fs-1 text-muted"></i>
            <h4 class="mt-3">No images found</h4>
            <p class="text-muted">Upload your first image to get started.</p>
            <a href="/upload" class="btn btn-primary">
                <i class="bi bi-upload"></i> Upload Image
            </a>
        </div>
        
        <div class="mt-4" th:if="${images != null && !images.empty}">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/gallery(page=${currentPage - 1}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}">
                            Previous
                        </a>
                    </li>
                    <li class="page-item" th:each="page : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${page == currentPage ? 'active' : ''}">
                        <a class="page-link" th:href="@{/gallery(page=${page}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}"
                           th:text="${page + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/gallery(page=${currentPage + 1}, size=${images.size}, projectId=${selectedProjectId}, search=${searchQuery})}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
    
    <script>
        function searchImages() {
            const searchInput = document.getElementById('searchInput');
            const projectFilter = document.getElementById('projectFilter');
            const query = searchInput.value;
            const projectId = projectFilter.value;
            
            let url = '/gallery?search=' + encodeURIComponent(query);
            if (projectId) {
                url += '&projectId=' + projectId;
            }
            window.location.href = url;
        }
        
        function clearSearch() {
            const projectFilter = document.getElementById('projectFilter');
            const projectId = projectFilter.value;
            
            let url = '/gallery';
            if (projectId) {
                url += '?projectId=' + projectId;
            }
            window.location.href = url;
        }
        
        function confirmDelete(imageId) {
            if (confirm('Are you sure you want to delete this image? This action cannot be undone.')) {
                fetch('/api/images/' + imageId, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Failed to delete image.');
                    }
                }).catch(error => {
                    alert('Error deleting image: ' + error.message);
                });
            }
        }
    </script>
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
