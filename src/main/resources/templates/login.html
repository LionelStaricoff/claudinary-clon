<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ImageHost</title>
</head>
<body class="bg-light">
    <div th:replace="~{base :: head}"></div>
    
    <div th:replace="~{base :: body}" th:with="
        title='Login - ImageHost',
        content=~{::main-content},
        scripts=''
    ">
        <main class="main-content">
            <div class="container">
                <div class="row justify-content-center align-items-center min-vh-100 py-5">
                    <div class="col-md-8 col-lg-6 col-xl-5">
                        <div class="card shadow-lg">
                            <div class="card-body p-5">
                                <!-- Logo -->
                                <div class="text-center mb-4">
                                    <a href="/" class="navbar-brand">
                                        <i class="fas fa-image display-6 text-primary"></i>
                                    </a>
                                    <h2 class="mt-3 fw-bold">Welcome Back</h2>
                                    <p class="text-muted">Login to your ImageHost account</p>
                                </div>

                                <!-- Error Message -->
                                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                                    <i class="fas fa-exclamation-circle me-2"></i>
                                    <span th:text="${error}"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>

                                <!-- Success Message -->
                                <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <span th:text="${success}"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>

                                <!-- Login Form -->
                                <form th:action="@{/api/auth/login}" method="post" id="loginForm">
                                    <div class="mb-3">
                                        <label for="usernameOrEmail" class="form-label">Username or Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="fas fa-user"></i>
                                            </span>
                                            <input type="text" 
                                                   class="form-control form-control-lg" 
                                                   id="usernameOrEmail" 
                                                   name="usernameOrEmail" 
                                                   placeholder="Enter your username or email"
                                                   required
                                                   autocomplete="username">
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="fas fa-lock"></i>
                                            </span>
                                            <input type="password" 
                                                   class="form-control form-control-lg" 
                                                   id="password" 
                                                   name="password" 
                                                   placeholder="Enter your password"
                                                   required
                                                   autocomplete="current-password">
                                        </div>
                                    </div>

                                    <div class="mb-3 form-check">
                                        <input type="checkbox" 
                                               class="form-check-input" 
                                               id="rememberMe" 
                                               name="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary btn-lg">
                                            <i class="fas fa-sign-in-alt me-2"></i> Login
                                        </button>
                                    </div>

                                    <div class="mt-3 text-center">
                                        <a th:href="@{/register}" class="text-decoration-none">
                                            Don't have an account? <strong>Register</strong>
                                        </a>
                                    </div>

                                    <div class="mt-3 text-center">
                                        <a href="#" class="text-decoration-none text-muted">
                                            <small>Forgot password?</small>
                                        </a>
                                    </div>
                                </form>

                                <!-- Divider -->
                                <div class="mt-4">
                                    <div class="d-flex align-items-center">
                                        <div class="flex-grow-1 border-bottom"></div>
                                        <span class="mx-3 text-muted small">or</span>
                                        <div class="flex-grow-1 border-bottom"></div>
                                    </div>
                                </div>

                                <!-- Demo Credentials -->
                                <div class="mt-4 text-center text-muted">
                                    <p class="mb-2 small">Try with demo credentials:</p>
                                    <div class="d-flex justify-content-center gap-3">
                                        <div class="bg-light rounded p-2">
                                            <small>
                                                <strong>Username:</strong> admin<br>
                                                <strong>Password:</strong> admin123
                                            </small>
                                        </div>
                                        <div class="bg-light rounded p-2">
                                            <small>
                                                <strong>Username:</strong> testuser<br>
                                                <strong>Password:</strong> test123
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Script for form submission -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    usernameOrEmail: formData.get('usernameOrEmail'),
                    password: formData.get('password'),
                    rememberMe: formData.get('rememberMe') === 'on'
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw err; });
                }
                return response.json();
            })
            .then(data => {
                if (data.accessToken) {
                    // Store token in localStorage
                    localStorage.setItem('jwtToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    
                    // Redirect to home page
                    window.location.href = '/';
                }
            })
            .catch(error => {
                alert('Login failed: ' + (error.message || 'Invalid credentials'));
            });
        });
    </script>
</body>
</html>
