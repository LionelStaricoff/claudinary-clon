<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">My Projects - ImageHost</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    
    <style>
        .project-card {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .project-card .card-body {
            padding: 15px;
        }
        .new-project-form {
            margin-bottom: 30px;
        }
        .project-actions {
            opacity: 0;
            transition: opacity 0.3s;
        }
        .project-card:hover .project-actions {
            opacity: 1;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <!-- Flash Messages -->
    <div th:if="${success}" class="container mt-3">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Success!</strong> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <div th:if="${error}" class="container mt-3">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error!</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Projects</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                <i class="bi bi-plus-lg"></i> Create Project
            </button>
        </div>
        
        <div class="row" th:if="${projects != null && !projects.empty}">
            <div class="col-md-4 mb-4" th:each="project : ${projects}">
                <div class="card project-card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h5 class="mb-1">
                                    <i class="bi bi-folder text-primary me-2"></i>
                                    <span th:text="${project.name}"></span>
                                    <span class="badge bg-secondary ms-2" 
                                          th:if="${project.isDefault}" th:text="Default"></span>
                                </h5>
                                <p class="text-muted small mb-2" th:text="${project.description}"></p>
                                <div class="d-flex align-items-center">
                                    <small class="text-muted me-3">
                                        <i class="bi bi-images me-1"></i>
                                        <span th:text="${project.imageCount != null ? project.imageCount : 0}"></span> images
                                    </small>
                                    <small class="text-muted">
                                        <i class="bi bi-calendar me-1"></i>
                                        <span th:text="${#temporals.format(project.createdAt, 'MMM dd, yyyy')}"></span>
                                    </small>
                                </div>
                            </div>
                            <div class="project-actions">
                                <a th:href="@{/gallery(projectId=${project.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> View
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="empty-state text-center py-5" th:if="${projects == null || projects.empty}">
            <i class="bi bi-folder-x fs-1 text-muted"></i>
            <h4 class="mt-3">No projects found</h4>
            <p class="text-muted">Create your first project to organize your images.</p>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                <i class="bi bi-plus-lg"></i> Create Project
            </button>
        </div>
    </main>
    
    <!-- Create Project Modal -->
    <div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/api/projects}" method="post" th:object="${newProject}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createProjectModalLabel">Create New Project</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="name" class="form-label">Project Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required
                                   placeholder="Enter project name">
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}"
                                      rows="3" placeholder="Enter project description"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isPublic" th:field="*{isPublic}">
                            <label class="form-check-label" for="isPublic">
                                Public Project (images in this project will be publicly accessible)
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Handle form submission via AJAX for better UX
        document.addEventListener('DOMContentLoaded', function() {
            const createProjectForm = document.querySelector('#createProjectModal form');
            if (createProjectForm) {
                createProjectForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const formData = new FormData(createProjectForm);
                    
                    fetch('/api/projects', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + localStorage.getItem('token')
                        },
                        body: JSON.stringify({
                            name: formData.get('name'),
                            description: formData.get('description'),
                            isPublic: formData.get('isPublic') === 'on'
                        })
                    }).then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            return response.json().then(error => {
                                throw new Error(error.message || 'Failed to create project');
                            });
                        }
                    }).catch(error => {
                        alert('Error: ' + error.message);
                    });
                });
            }
        });
    </script>
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
