<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Image Details - ImageHost</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    
    <style>
        .image-container {
            text-align: center;
            margin-bottom: 30px;
        }
        #mainImage {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .image-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }
        .detail-value {
            color: #333;
        }
        .action-btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .format-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .badge-jpg { background-color: #e3f2fd; color: #1976d2; }
        .badge-png { background-color: #e8f5e8; color: #388e3c; }
        .badge-gif { background-color: #f3e5f5; color: #7b1fa2; }
        .badge-webp { background-color: #e0f7fa; color: #00838f; }
        .badge-other { background-color: #f5f5f5; color: #666; }
    </style>
</head>
<body>
    <!-- Flash Messages -->
    <div th:if="${success}" class="container mt-3">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Success!</strong> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <div th:if="${error}" class="container mt-3">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error!</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="container mt-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item"><a href="/gallery">Gallery</a></li>
                <li class="breadcrumb-item active" th:text="${image.originalFilename}"></li>
            </ol>
        </nav>
        
        <div class="image-container">
            <img id="mainImage" th:src="${image.url}" alt="Main image" class="img-fluid">
        </div>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div class="flex-grow-1">
                        <h3 class="mb-1" th:text="${image.originalFilename}"></h3>
                        <div class="d-flex align-items-center">
                            <span class="format-badge " 
                                  th:classappend="${'badge-' + (image.originalFormat != null ? image.originalFormat.toLowerCase() : 'other')}"
                                  th:text="${image.originalFormat}"></span>
                            <small class="text-muted ms-2">
                                <i class="bi bi-calendar me-1"></i>
                                <span th:text="${#temporals.format(image.createdAt, 'MMM dd, yyyy HH:mm')}"></span>
                            </small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary action-btn" onclick="copyImageUrl()">
                            <i class="bi bi-clipboard"></i> Copy URL
                        </button>
                        <a th:href="${image.url}" class="btn btn-primary action-btn" download th:text="${image.originalFilename}">
                            <i class="bi bi-download"></i> Download
                        </a>
                    </div>
                </div>
                
                <div class="image-info">
                    <div class="detail-row">
                        <span class="detail-label">Dimensions:</span>
                        <span class="detail-value" th:text="${image.width} + ' x ' + ${image.height} + ' px'"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">File Size:</span>
                        <span class="detail-value" th:text="${#numbers.formatDecimal(image.fileSize / (1024 * 1024), 1, 2)} + ' MB'"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Content Type:</span>
                        <span class="detail-value" th:text="${image.contentType}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Storage Path:</span>
                        <span class="detail-value text-break" th:text="${image.filePath}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Project:</span>
                        <span class="detail-value" th:text="${image.projectName}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Views:</span>
                        <span class="detail-value" th:text="${image.viewCount}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Downloads:</span>
                        <span class="detail-value" th:text="${image.downloadCount}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Public URL:</span>
                        <span class="detail-value text-break">
                            <a th:href="${image.url}" th:text="${image.url}" target="_blank"></a>
                        </span>
                    </div>
                    <div class="detail-row" th:if="${image.webpUrl != null}">
                        <span class="detail-label">WebP URL:</span>
                        <span class="detail-value text-break">
                            <a th:href="${image.webpUrl}" th:text="${image.webpUrl}" target="_blank"></a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5>Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-wrap">
                            <a th:href="${image.url}" class="btn btn-primary action-btn" download th:text="${image.originalFilename}">
                                <i class="bi bi-download me-1"></i> Download Original
                            </a>
                            <a th:href="${image.webpUrl}" class="btn btn-outline-primary action-btn" 
                               th:if="${image.webpUrl != null}" download th:text="${image.filename + '.webp'}">
                                <i class="bi bi-download me-1"></i> Download WebP
                            </a>
                            <button class="btn btn-outline-secondary action-btn" onclick="copyImageUrl()">
                                <i class="bi bi-clipboard me-1"></i> Copy URL
                            </button>
                            <button class="btn btn-outline-danger action-btn" onclick="confirmDelete()">
                                <i class="bi bi-trash me-1"></i> Delete Image
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5>Image Versions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-file-earmark-image text-primary me-3 fs-4"></i>
                                <div>
                                    <strong>Original Image</strong>
                                    <div class="text-muted small">
                                        <span th:text="${image.originalFormat}"></span> - 
                                        <span th:text="${#numbers.formatDecimal(image.fileSize / 1024, 1, 2)} + ' KB'"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex align-items-center" th:if="${image.hasWebpVersion}">
                                <i class="bi bi-file-earmark-image text-success me-3 fs-4"></i>
                                <div>
                                    <strong>WebP Version</strong>
                                    <div class="text-muted small">
                                        WebP format - 
                                        <span th:text="${#numbers.formatDecimal(image.webpSize / 1024, 1, 2)} + ' KB'"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex align-items-center">
                                <i class="bi bi-file-earmark-image text-info me-3 fs-4"></i>
                                <div>
                                    <strong>Thumbnail</strong>
                                    <div class="text-muted small">
                                        200x200 px - Optimized for preview
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        function copyImageUrl() {
            const url = document.querySelector('.detail-value a').href;
            navigator.clipboard.writeText(url).then(() => {
                // Show a temporary notification
                const toast = document.createElement('div');
                toast.className = 'position-fixed top-0 end-0 p-3 bg-success text-white toast-style';
                toast.style.zIndex = 10000;
                toast.innerHTML = '<i class="bi bi-check-circle me-2"></i> URL copied to clipboard!';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }).catch(err => {
                alert('Failed to copy URL: ' + err.message);
            });
        }
        
        function confirmDelete() {
            const imageId = window.location.pathname.split('/').pop();
            if (confirm('Are you sure you want to delete this image? This action cannot be undone.')) {
                fetch('/api/images/' + imageId, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = '/gallery';
                    } else {
                        alert('Failed to delete image.');
                    }
                }).catch(error => {
                    alert('Error deleting image: ' + error.message);
                });
            }
        }
    </script>
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
